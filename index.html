        }

        .screen.active {

        }

        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #34495e;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #6c5ce7;
        }

        .btn-start, .btn-next, .btn-restart {
            width: 100%;
            background: #ff7675;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.4);
            transition: 0.2s;
        }

        .btn-start:hover, .btn-next:hover:not(:disabled), .btn-restart:hover {
            background: #d63031;
            transform: translateY(-2px);
        }

        .btn-next:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #00b894;
            transition: width 0.3s;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #636e72;
            margin-bottom: 20px;

            font-size: 18px;
            color: #2d3436;
            margin-bottom: 15px;
            line-height: 1.5;
            white-space: pre-line;

            text-align: center;
            margin-bottom: 15px;

            max-height: 230px;

            border-radius: 10px;
            text-align: left;
            font-size: 15px;

        const identityForm = document.getElementById('identity-form');
        const questionText = document.getElementById('question-text');
        const questionImgContainer = document.getElementById('question-image-container');
        const optionsContainer = document.getElementById('options-container');
        const btnNext = document.getElementById('btn-next');
        const progressBar = document.getElementById('progress-bar');
        const questionNumber = document.getElementById('question-number');
        const scoreLive = document.getElementById('score-live');

        // Submit Form Identitas
        identityForm.addEventListener('submit', (e) => {
            e.preventDefault();
            studentName = document.getElementById('student-name').value;
            studentClass = document.getElementById('student-class').value;

            startScreen.classList.remove('active');
            quizScreen.classList.add('active');
            loadQuestion();
        });

        // Muat Soal
        function loadQuestion() {
            selectedOptionIndex = null;
            btnNext.disabled = true;

            const data = quizData[currentQuestion];
            questionText.innerText = `${currentQuestion + 1}. ${data.question}`;
            
            // Progress Bar & Info
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
            questionNumber.innerText = `Soal ${currentQuestion + 1} / ${quizData.length}`;
            scoreLive.innerText = `Skor: ${Math.round(score)}`;

            // Render Gambar Soal Utama (Jika URL tidak null)
            questionImgContainer.innerHTML = "";
            if (data.image) {
                const img = document.createElement('img');
                img.src = data.image;
                img.alt = "Gambar Soal";
                questionImgContainer.appendChild(img);
            }

            // Render Pilihan Jawaban
            optionsContainer.innerHTML = "";
            data.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.type = 'button';
                
                let content = `<span>${opt.text || ''}</span>`;
                if (opt.image) {
                    content += `<img src="${opt.image}" alt="Pilihan ${String.fromCharCode(65 + idx)}">`;
                }
                btn.innerHTML = content;

                btn.onclick = () => selectOption(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedOptionIndex = index;
            btnNext.disabled = false;
        }

        btnNext.addEventListener('click', () => {
            // Bobot skor per soal (100 / 40 = 2.5 poin per soal)
            if (quizData[currentQuestion].answer === selectedOptionIndex) {
                score += (100 / quizData.length);
            }

            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        // Halaman Akhir & Pengiriman ke Google Sheets
        function showResults() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');

            const finalScoreFormatted = Math.round(score);

            document.getElementById('res-name').innerText = studentName;
            document.getElementById('res-class').innerText = studentClass;
            document.getElementById('final-score').innerText = finalScoreFormatted;

            sendDataToGoogleSheet(studentName, studentClass, finalScoreFormatted);
        }

        function sendDataToGoogleSheet(name, className, scoreValue) {
            const statusDiv = document.getElementById('status-saving');
            
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nama: name,
                    kelas: className,
                    skor: scoreValue,
                    waktu: new Date().toLocaleString("id-ID")
                })
            }).then(() => {
                statusDiv.innerHTML = "✅ Data nilai berhasil tersimpan ke sistem!";
                statusDiv.style.color = "#00b894";
            }).catch(error => {
                statusDiv.innerHTML = "❌ Gagal menyimpan nilai otomatis.";
                statusDiv.style.color = "#d63031";
                console.error("Error:", error);
            });
        }
    </script>
</body>
</html>
